# This branch targets NVIDIA Maxwell GPUs (CUDA compute capability 5.2, e.g. GTX 900 series / Titan X / Quadro M-series).
# It is self-contained: the GPU reservation and cache volume live here, so `docker compose up --build` is enough.
# NOTE: compose.cuda.yaml, compose.cuda-cdi.yaml and compose.cpu.yaml extend this file and are not adjusted for this branch.
services:
  speaches:
    container_name: speaches
    image: speaches:cuda-12.6.3-maxwell
    build:
      dockerfile: Dockerfile
      context: .
      platforms:
        - linux/amd64
      args:
        BASE_IMAGE: nvidia/cuda:12.6.3-base-ubuntu24.04
        # torch wheels built against CUDA 12.6 are the last ones that still contain sm_52 kernels
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
    restart: unless-stopped
    ports:
      - 8000:8000
    develop:
      watch:
        - action: rebuild
          path: ./uv.lock
        - action: sync+restart
          path: ./src
          target: /home/ubuntu/speaches/src
    env_file:
      - path: .env
        required: false
    environment:
      # Maxwell has no fp16 tensor cores and no int8 (DP4A) support in CTranslate2, so faster-whisper must run in float32
      WHISPER__COMPUTE_TYPE: float32
      # onnxruntime-gpu 1.24.4 ships no sm_52 kernels (cudaErrorNoKernelImageForDevice), so ONNX models (kokoro, parakeet, piper, VAD) run on CPU
      UNSTABLE_ORT_OPTS__EXCLUDE_PROVIDERS: '["TensorrtExecutionProvider", "CUDAExecutionProvider"]'
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # nvidia-smi index 1 is a Quadro M2000 (compute 5.2); index 0 is a CMP 50HX (compute 7.5) and is intentionally not exposed
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"] # TODO: won't work if a user changes the port
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
volumes:
  hf-hub-cache:
